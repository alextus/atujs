    <code>{top:0,left:0}</code>，游离节点上 <code>width()</code> 恒为 <code>undefined</code>。<br>

        { name: '$.ajaxJSONP', note: '打桩 $.ajaxJSONP：校验自动补 callback=?', check: () => { var orig = $.ajaxJSONP, cap = null; $.ajaxJSONP = function (o) { cap = o; return {} }; try { $.ajax({ url: '/atu/test?a=1', dataType: 'jsonp' }) } finally { $.ajaxJSONP = orig } return !!cap && cap.url.indexOf('callback=?') > -1 } },
        { name: '$.fn.load', note: '打桩 $.ajax：校验 url 与 selector 拆分', check: () => { var orig = $.ajax, cap = null; $.ajax = function (o) { cap = o; return {} }; var d = el('<div></div>'); try { $(d).load('./index.html #summary', function () { }) } finally { $.ajax = orig } return !!cap && cap.url === './index.html' && typeof cap.success === 'function' } },
        { name: '$.ajaxSettings.type 默认 GET', check: () => !!$.ajaxSettings && $.ajaxSettings.type === 'GET' },
        { name: '$.ajaxSettings.timeout 默认 0', check: () => $.ajaxSettings.timeout === 0 },
        { name: '$.active', check: () => $.active !== undefined }
      ]
    }, {
      title: '五、动画与补间（4.5）',
      items: [
        { name: 'animate() 执行并回调', note: '200ms 后校验宽度已变为 200px', check: () => new Promise(function (res) {
          var d = box('width:10px;height:10px')
          var done = false
          $(d).animate({ width: '200px' }, 200, 'linear', function () {
            done = true
            res(Math.round(parseFloat($(d).css('width'))) === 200)
          })
          setTimeout(function () { if (!done) res(false) }, 2000)
        }) },
        { name: 'animateTo', check: () => typeof $().animateTo === 'function' },
        { name: 'animateFrom', check: () => typeof $().animateFrom === 'function' },
        { name: 'anim', check: () => typeof $().anim === 'function' },
        { name: 'preAnim', check: () => typeof $().preAnim === 'function' },
        { name: 'tween', check: () => typeof $().tween === 'function' },
        { name: 'fadeIn / fadeOut / fadeToggle / fadeTo', check: () => ['fadeIn', 'fadeOut', 'fadeToggle', 'fadeTo'].every(function (m) { return typeof $()[m] === 'function' }) },
        { name: 'Tween.to / Tween.fromTo', check: () => typeof window.Tween === 'object' && typeof Tween.to === 'function' && typeof Tween.fromTo === 'function' }
      ]
    }, {
      title: '六、资源加载（4.6）',
      items: [
        { name: '$.loadFile', check: () => typeof $.loadFile === 'function' },
        { name: '$.fn.loadFile.defaults', check: () => !!$.fn.loadFile && typeof $.fn.loadFile.defaults === 'object' }
      ]
    }, {
      title: '七、弹层（4.7）',
      items: [
        { name: '$.tip', check: () => typeof $.tip === 'function' },
        { name: '$.alert', check: () => typeof $.alert === 'function' },
        { name: '$.showLoading', check: () => typeof $.showLoading === 'function' },
        { name: '$.hideLoading', check: () => typeof $.hideLoading === 'function' }
      ]
    }, {
      title: '八、环境判断（4.8）',
      items: [
        { name: 'browser', check: () => typeof browser !== 'undefined' && !!browser.ua },
        { name: 'isPc / is_pc', check: () => typeof isPc !== 'undefined' && isPc === is_pc },
        { name: 'isMob / is_mob', check: () => typeof isMob !== 'undefined' && isMob === is_mob },
        { name: 'isWeixin / is_weixin', check: () => typeof isWeixin !== 'undefined' && isWeixin === is_weixin },
        { name: 'isLocal / is_local', check: () => typeof isLocal !== 'undefined' && isLocal === is_local },
        { name: 'isMob 与 isPc 互斥', check: () => isMob === !isPc },
        { name: 'system', check: () => typeof system !== 'undefined' && system.type !== undefined },
        { name: 'is 系列（isChrome 等）', note: '由 _bs 列表生成，挂在 window 上', check: () => typeof window.isChrome !== 'undefined' && typeof window.is_weibo !== 'undefined' },
        { name: 'touch / touchmove / touchend 常量', check: () => (touch === 'touchstart' || touch === 'mousedown') && (touchend === 'touchend' || touchend === 'mouseup') }
      ]
    }, {
      title: '九、时间日期（4.9）',
      items: [
        { name: 'timestamp()', check: () => typeof timestamp === 'function' && timestamp() > 0 },
        { name: 'newDate()', check: () => typeof newDate === 'function' && !!newDate() },
        { name: 'year / month / week / day / hour / now', check: () => year('2024-01-02') === 2024 && month('2024-01-02') === 1 && day('2024-01-02') === 2 && hour('2024-01-02 03:04:05') === 3 && week('2024-01-02') >= 0 && week('2024-01-02') <= 6 && now('2024-01-02 03:04:05') === '2024-01-02 03:04:05' },
        { name: 'getTime2Time / getLeftTime / getPassTime / format', check: () => getTime2Time('2020-01-01 00:00:00') > 0 && getPassTime('2020-01-01') > 0 && getLeftTime('2099-01-01') > 0 && format(61) === '01:01' },
        { name: 'Alexdate / FormatNum', check: () => Alexdate('2024-01-02') === '20240102' && Alexdate('2024-01-02', '-') === '2024-01-02' && FormatNum(7, 2) === '07' }
      ]
    }, {
      title: '十、存储（4.10）',
      items: [
        { name: 'localStorageSupported', check: () => typeof localStorageSupported === 'function' && localStorageSupported() === true },
        {
          name: 'setData / getData', note: '不支持 localStorage 时跳过', check: () => {
            if (!localStorageSupported()) return null
            setData('__atu_t', 'v1')
            var ok = getData('__atu_t') === 'v1'
            try { localStorage.removeItem('__atu_t') } catch (e) { }
            return ok
          }
        },
        { name: 'getCookie / setCookie / delCookie', note: 'file:// 下 Cookie 不可用则仅校验存在性', check: () => {
          if (typeof getCookie !== 'function' || typeof setCookie !== 'function') return false
          if (location.protocol === 'file:') return typeof delCookie === 'function'
          setCookie('__atu_c', 'v1')
          var ok = getCookie('__atu_c') === 'v1'
          delCookie('__atu_c')
          return ok
        } }
      ]
    }, {
      title: '十一、Atu 业务扩展（4.11）',
      items: [
        { name: 'Atu.ini', note: '打桩 $.loadFile，避免真去加载微信 JS', check: () => { var orig = $.loadFile, loaded = null; $.loadFile = function (u) { loaded = u }; try { Atu.ini('__atu_test') } finally { $.loadFile = orig } return Atu.evtUrl === location.href && /atuad\.cn/.test(Atu.wxUrl) && Atu.site === '' && Atu.ua === '' && (typeof window.wx !== 'undefined' || loaded === 'http://res.wx.qq.com/open/js/jweixin-1.4.0.js') } },
        { name: 'Atu.iniUser', note: '打桩 $.get：校验上报 act=ini', check: () => { var orig = $.get, cap = null, openid = Atu.openid; $.get = function (u, d, cb) { cap = { url: u, data: d }; cb && cb({}) }; try { Atu.openid = ''; Atu.iniUser(function () { }) } finally { $.get = orig; Atu.openid = openid } return !!cap && cap.data.act.act === 'ini' } },
        { name: 'Atu.act 组装上报参数', note: '打桩 $.get：act + 自定义字段', check: () => { var orig = $.get, cap = null; $.get = function (u, d) { cap = { url: u, data: d } }; try { Atu.act('pv', { x: 1 }) } finally { $.get = orig } return !!cap && cap.url === Atu.api && cap.data.act.act === 'pv' && cap.data.x === 1 } },
        { name: 'act / sendDataBack / sendMsgBack 同一函数', check: () => Atu.act === Atu.sendDataBack && Atu.act === Atu.sendMsgBack },
        { name: 'Atu.iniWx + Atu.iniShare', note: '打桩 $.get 与 wx 对象', check: () => { var origGet = $.get, origWx = window.wx, cfg = null, shared = {}; window.wx = { config: function (o) { cfg = o }, ready: function (fn) { fn() }, error: function () { }, updateAppMessageShareData: function (o) { shared.app = o }, onMenuShareAppMessage: function (o) { shared.app2 = o }, updateTimelineShareData: function (o) { shared.t = o }, onMenuShareTimeline: function (o) { shared.t2 = o } }; $.get = function (u, d, cb) { cb({ appId: 'a', timestamp: 1, nonceStr: 'n', signature: 's' }) }; try { Atu.wxUrl = '//atuad.cn/wx/'; Atu.iniWx({ title: 't', desc: 'd', link: 'l', imgUrl: 'i' }) } finally { $.get = origGet; window.wx = origWx } return !!cfg && cfg.appId === 'a' && !!shared.app && shared.app.title === 't' && !!shared.t } },
        { name: 'Atu.iniClick + Atu.addClick', note: '打桩 $.get：校验统计参数', check: () => { var orig = $.get, cap = null; $.get = function (u, d) { cap = { url: u, data: d } }; try { Atu.iniClick('__atu_site'); Atu.addClick('x') } finally { $.get = orig } return !!cap && cap.url.indexOf('tongji') > -1 && cap.data.site === '__atu_site' && cap.data.title === 'x' && cap.data.type === 1 } }
      ]
    }, {
      title: '十二、其它全局工具（4.12）',
      items: [
        { name: 'trim', check: () => typeof trim === 'function' && trim('  a  ') === 'a' },
        { name: 'capitalizeFirstLetter', check: () => capitalizeFirstLetter('abc') === 'Abc' },
        { name: 'ce', check: () => ce('div').tagName === 'DIV' },
        { name: 'at', check: () => { var d = el('<div id="__atu_x"></div>'); return at('__atu_x') === d } },
        { name: 'urlencode / urldecode', check: () => urldecode(urlencode('a b')) === 'a b' },
        {
          name: 'arrRand / RandArr（数组乱序）', note: '返回打乱后的新数组，不改动原数组',
          check: () => {
            var a = [1, 2, 3]
            var r = arrRand(a)
            return Array.isArray(r) && r.length === 3 && r.slice().sort().join(',') === '1,2,3' && a.join(',') === '1,2,3'
          }
        },
        { name: 'arrRemove / arrDelete', note: '移除指定项并返回新数组，不影响原数组', check: () => { var a = [1, 2, 3]; var r = arrRemove(a, 2); return r.join(',') === '1,3' && a.join(',') === '1,2,3' && arrDelete([1, 2, 3], 2).join(',') === '1,3' } },
        { name: 'get / getXY / newImg / getEvtUrl', check: () => { var img = newImg('data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='); var xy = getXY({ clientX: 3, clientY: 4, pageX: 3, pageY: 4 }); return img instanceof HTMLImageElement && img.src.indexOf('data:image/gif') > -1 && get('__atu_no_such__') === '' && getEvtUrl() === location.href.substring(0, location.href.lastIndexOf('/') + 1) && !!xy && xy.x === 3 && xy.y === 4 } },
        { name: 'copy / download / click / e', note: 'copy 会临时插入隐藏 textarea，测完移除', check: () => { var d = el('<i></i>'); var n = 0; d.addEventListener('click', function () { n++ }); click(d); var okE = e('result') === document.getElementById('result'); copy('__atu_copy__'); var okCopy = $('#atuCopyInput').val() === '__atu_copy__'; $('#atuCopyInput').remove(); return n === 1 && okE && okCopy && typeof download === 'function' } },
        { name: 'convertCanvasToImage / convertCanvasToImgData', check: () => { var c = document.createElement('canvas'); c.width = 2; c.height = 2; var img = convertCanvasToImage(c); var data = convertCanvasToImgData(c); return img instanceof HTMLImageElement && img.src.indexOf('data:image/png') === 0 && typeof data === 'string' && data.indexOf('data:image/jpeg') === 0 } }
      ]
    }]

    /* ---------- 执行器（原生 DOM 渲染，保证 Atu 挂了也能出报告） ---------- */
    var result = document.getElementById('result')
    var summary = document.getElementById('summary')

    function itemNode(item) {
      var div = document.createElement('div')
      div.className = 'feature-item'
      var name = document.createElement('span')
      name.className = 'feature-name'
      name.textContent = item.name
      if (item.note) {
        var small = document.createElement('small')
        small.textContent = item.note
        name.appendChild(small)
      }
      var status = document.createElement('span')
      status.className = 'status'
      div.appendChild(name)
      div.appendChild(status)
      return { div: div, status: status }
    }

    function setStatus(node, kind, text) {
      node.status.className = 'status ' + kind
      node.status.textContent = text
    }

    async function runAll() {
      result.innerHTML = ''
      summary.innerHTML = ''
      var total = 0, passed = 0, failed = 0, skipped = 0
      var failNames = []

      for (var g of GROUPS) {
        var h = document.createElement('h2')
        h.className = 'group-title'
        h.textContent = g.title
        result.appendChild(h)

        var grid = document.createElement('div')
        grid.className = 'list feature-grid'
        result.appendChild(grid)

        for (var item of g.items) {
          total++
          var node = itemNode(item)
          grid.appendChild(node.div)

          var r
          try {
            r = item.check()
            if (r && typeof r.then === 'function') r = await r
          } catch (e) {
            setStatus(node, 'not-supported', '❌ ' + (e && e.message ? e.message : e))
            failed++
            failNames.push(item.name)
            continue
          }

          if (r === null) {
            setStatus(node, 'skipped', '⚠️ 跳过')
            skipped++
          } else if (r) {
            setStatus(node, 'supported', '✅ 通过')
            passed++
          } else {
            setStatus(node, 'not-supported', '❌ 失败')
            failed++
            failNames.push(item.name)
          }
        }
      }

      // 清理沙箱
      var h2 = document.getElementById('__atu_host')
      if (h2) h2.parentNode.removeChild(h2)

      summary.innerHTML =
        '<span>共 ' + total + ' 项</span>' +
        '<span style="background:#c6f6d5;color:#22543d">通过 ' + passed + '</span>' +
        '<span style="background:#fed7d7;color:#742a2a">失败 ' + failed + '</span>' +
        '<span style="background:#feebc8;color:#7b341e">跳过 ' + skipped + '</span>'

      if (failNames.length) console.warn('[atu test] 失败项：', failNames)
      console.log('[atu test] 共 ' + total + '，通过 ' + passed + '，失败 ' + failed + '，跳过 ' + skipped)
    }

    document.getElementById('checkBtn').addEventListener('click', runAll)
    window.addEventListener('load', runAll)
  </script>
</body>
