!function($) {
  
	$.fn.originWidth = function(){
    let e = $(this).clone().css("display", "block").appendTo("body");
    let width = e.width();
    e.remove();
    return width;
  }
	$.fn.originHeight = function(){
    let e = $(this).clone().css("display", "block").appendTo("body");
    let height = e.height();
    e.remove();
    return height;
  }
} (Atu);
